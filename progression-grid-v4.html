<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progression Grid v3</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-panel: #12151c;
      --border: #2a3040;
      --text: #c8d0e0;
      --text-dim: #5a6070;
      
      --blue: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.4);
      --blue-dim: #1e3a5f;
      
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.4);
      --red-dim: #5f1e1e;
      
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.4);
      --orange-dim: #5f3a1e;
      
      --purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.5);
      --purple-dim: #3b1e5f;
      
      --gold: #eab308;
      --gold-glow: rgba(234, 179, 8, 0.5);
      --gold-dim: #5f4a1e;
      
      --completed: #22c55e;
      
      --cell-size: 70px;
      --gap: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
    }

    .grid-container {
      position: relative;
      padding: 2rem;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .grid-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(to bottom, var(--bg-panel) 0%, var(--bg-panel) 10%, transparent 100%);
      z-index: 10;
      pointer-events: none;
      border-radius: 8px 8px 0 0;
    }

    .more-indicator {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-dim);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
    }

    .more-indicator .arrows {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0.5;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(6, var(--cell-size));
      gap: var(--gap);
      height: var(--cell-size);
    }

    .row.boss-row {
      height: 90px;
    }

    .row.tall-row {
      height: calc(var(--cell-size) * 2 + var(--gap));
    }

    /* Standard cell */
    .cell {
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      border: 2px solid transparent;
    }

    .cell.locked {
      background: var(--bg-dark);
      border-color: var(--border);
      cursor: not-allowed;
      opacity: 0.4;
    }

    .cell.available.unit {
      background: var(--blue-dim);
      border-color: var(--blue);
      box-shadow: 0 0 20px var(--blue-glow), inset 0 0 20px var(--blue-glow);
      animation: pulse-blue 2s ease-in-out infinite;
    }

    .cell.available.upgrade {
      background: var(--red-dim);
      border-color: var(--red);
      box-shadow: 0 0 20px var(--red-glow), inset 0 0 20px var(--red-glow);
      animation: pulse-red 2s ease-in-out infinite;
    }

    .cell.available.special {
      background: var(--orange-dim);
      border-color: var(--orange);
      box-shadow: 0 0 20px var(--orange-glow), inset 0 0 20px var(--orange-glow);
      animation: pulse-orange 2s ease-in-out infinite;
    }

    @keyframes pulse-blue {
      0%, 100% { box-shadow: 0 0 15px var(--blue-glow), inset 0 0 15px var(--blue-glow); }
      50% { box-shadow: 0 0 25px var(--blue-glow), inset 0 0 25px var(--blue-glow); }
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 15px var(--red-glow), inset 0 0 15px var(--red-glow); }
      50% { box-shadow: 0 0 25px var(--red-glow), inset 0 0 25px var(--red-glow); }
    }

    @keyframes pulse-orange {
      0%, 100% { box-shadow: 0 0 15px var(--orange-glow), inset 0 0 15px var(--orange-glow); }
      50% { box-shadow: 0 0 25px var(--orange-glow), inset 0 0 25px var(--orange-glow); }
    }

    .cell.available:hover { transform: scale(1.05); }

    .cell.completed {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--completed);
    }

    .cell.completed .cell-icon { color: var(--completed); }
    .cell.completed .cell-label { color: var(--completed); }

    .cell-icon { font-size: 1.5rem; margin-bottom: 2px; }

    .cell.unit .cell-icon { color: var(--blue); }
    .cell.upgrade .cell-icon { color: var(--red); }
    .cell.special .cell-icon { color: var(--orange); }

    .cell-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.2;
    }

    .cell.start {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--completed);
      border-width: 3px;
    }

    .cell.start .cell-icon { color: var(--completed); }

    /* Boss */
    .boss-cell {
      grid-column: 1 / -1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      border: 3px solid transparent;
      background: var(--bg-dark);
    }

    .boss-cell.locked {
      border-color: var(--purple-dim);
      cursor: not-allowed;
      opacity: 0.5;
    }

    .boss-cell.available {
      background: var(--purple-dim);
      border-color: var(--purple);
      box-shadow: 0 0 30px var(--purple-glow), inset 0 0 30px var(--purple-glow);
      animation: pulse-boss 2s ease-in-out infinite;
    }

    @keyframes pulse-boss {
      0%, 100% { box-shadow: 0 0 25px var(--purple-glow), inset 0 0 20px var(--purple-glow); }
      50% { box-shadow: 0 0 40px var(--purple-glow), inset 0 0 35px var(--purple-glow); }
    }

    .boss-cell.available:hover { transform: scale(1.02); }

    .boss-cell.completed {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--completed);
    }

    .boss-icon { font-size: 2.5rem; color: var(--purple); }
    .boss-cell.completed .boss-icon { color: var(--completed); }

    .boss-info { display: flex; flex-direction: column; gap: 0.25rem; }

    .boss-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: bold;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .boss-cell.completed .boss-name { color: var(--completed); }

    .boss-reward { font-size: 0.7rem; color: var(--text-dim); }

    .boss-tag {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--purple);
      color: var(--bg-dark);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: bold;
      padding: 2px 12px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .boss-cell.completed .boss-tag { background: var(--completed); }

    /* Fortress */
    .fortress-cell {
      grid-column: span 2;
      grid-row: span 2;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      border: 3px solid transparent;
      background: var(--bg-dark);
    }

    .fortress-cell.locked {
      border-color: var(--gold-dim);
      cursor: not-allowed;
      opacity: 0.5;
    }

    .fortress-cell.available {
      background: var(--gold-dim);
      border-color: var(--gold);
      box-shadow: 0 0 35px var(--gold-glow), inset 0 0 35px var(--gold-glow);
      animation: pulse-fortress 2s ease-in-out infinite;
    }

    @keyframes pulse-fortress {
      0%, 100% { box-shadow: 0 0 30px var(--gold-glow), inset 0 0 25px var(--gold-glow); }
      50% { box-shadow: 0 0 45px var(--gold-glow), inset 0 0 40px var(--gold-glow); }
    }

    .fortress-cell.available:hover { transform: scale(1.03); }

    .fortress-cell.completed {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--completed);
    }

    .fortress-icon { font-size: 3rem; color: var(--gold); margin-bottom: 0.5rem; }
    .fortress-cell.completed .fortress-icon { color: var(--completed); }

    .fortress-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--gold);
      text-transform: uppercase;
    }

    .fortress-cell.completed .fortress-name { color: var(--completed); }

    .fortress-reward {
      font-size: 0.6rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
      text-align: center;
    }

    .fortress-tag {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: var(--bg-dark);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .fortress-cell.completed .fortress-tag { background: var(--completed); }

    .fortress-req {
      position: absolute;
      bottom: 8px;
      font-size: 0.6rem;
      color: var(--text-dim);
    }

    .fortress-req .filled { color: var(--completed); }

    /* Legend & Stats */
    .legend {
      display: flex;
      gap: 1.5rem;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item { display: flex; align-items: center; gap: 0.5rem; }

    .legend-dot { width: 16px; height: 16px; border-radius: 4px; }
    .legend-dot.unit { background: var(--blue); }
    .legend-dot.upgrade { background: var(--red); }
    .legend-dot.special { background: var(--orange); }
    .legend-dot.boss { background: var(--purple); }
    .legend-dot.fortress { background: var(--gold); }
    .legend-dot.completed { background: var(--completed); }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat { display: flex; align-items: center; gap: 0.5rem; }

    .stat-value { font-family: 'Orbitron', sans-serif; font-weight: bold; }
    .stat-value.blue { color: var(--blue); }
    .stat-value.red { color: var(--red); }
    .stat-value.orange { color: var(--orange); }
    .stat-value.purple { color: var(--purple); }
    .stat-value.gold { color: var(--gold); }

    /* Tooltip */
    .tooltip {
      position: fixed;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 1000;
      max-width: 200px;
    }

    .tooltip.visible { opacity: 1; }

    .tooltip-title { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; margin-bottom: 0.25rem; }
    .tooltip-title.unit { color: var(--blue); }
    .tooltip-title.upgrade { color: var(--red); }
    .tooltip-title.special { color: var(--orange); }
    .tooltip-title.boss { color: var(--purple); }
    .tooltip-title.fortress { color: var(--gold); }

    .tooltip-desc { color: var(--text-dim); font-size: 0.7rem; line-height: 1.4; }

    .tooltip-status {
      margin-top: 0.5rem;
      font-size: 0.65rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .tooltip-status.available { color: var(--completed); }
    .tooltip-status.locked { color: var(--text-dim); }

    @keyframes complete-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .completing { animation: complete-pop 0.3s ease; }
  </style>
</head>
<body>
  <header>
    <h1>Campaign Progress</h1>
    <div class="subtitle">Unlock adjacent cells • Surround fortresses • Defeat bosses</div>
  </header>

  <div class="grid-container">
    <div class="more-indicator">
      <div class="arrows"><span>▲</span><span>▲</span></div>
      <span>MORE AHEAD</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot unit"></div> Unit</div>
    <div class="legend-item"><div class="legend-dot upgrade"></div> Upgrade</div>
    <div class="legend-item"><div class="legend-dot special"></div> Special</div>
    <div class="legend-item"><div class="legend-dot boss"></div> Boss</div>
    <div class="legend-item"><div class="legend-dot fortress"></div> Fortress</div>
    <div class="legend-item"><div class="legend-dot completed"></div> Done</div>
  </div>

  <div class="stats">
    <div class="stat">Units: <span class="stat-value blue" id="unit-count">0</span></div>
    <div class="stat">Upgrades: <span class="stat-value red" id="upgrade-count">0</span></div>
    <div class="stat">Specials: <span class="stat-value orange" id="special-count">0</span></div>
    <div class="stat">Bosses: <span class="stat-value purple" id="boss-count">0</span></div>
    <div class="stat">Fortresses: <span class="stat-value gold" id="fortress-count">0</span></div>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="tooltip-title"></div>
    <div class="tooltip-desc"></div>
    <div class="tooltip-status"></div>
  </div>

  <script>
    const icons = { unit: '⬡', upgrade: '▲', special: '★' };

    // Grid defined row-by-row, bottom to top
    // Each row is array of 6 cells, OR a boss object, OR a fortress-row pair
    // Fortress rows are TWO consecutive rows with the fortress spanning cols 3-4
    
    const gridRows = [
      // Row 0 (bottom - starting row)
      { type: 'normal', cells: [
        { type: 'unit', name: 'Infantry', desc: 'Basic ground unit.' },
        { type: 'upgrade', name: '+5% Atk', desc: 'All units +5% damage.' },
        { type: 'unit', name: 'Recon', desc: 'Fast scout. High vision.' },
        { type: 'special', name: 'Quick Deploy', desc: 'Deploy 1 turn faster.' },
        { type: 'upgrade', name: '+1 Vision', desc: 'All units see further.' },
        { type: 'unit', name: 'Mech', desc: 'Heavy infantry.' },
      ]},
      // Row 1
      { type: 'normal', cells: [
        { type: 'upgrade', name: '+1 Move', desc: 'Infantry +1 movement.' },
        { type: 'unit', name: 'APC', desc: 'Transport. Carries infantry.' },
        { type: 'special', name: 'Resupply', desc: 'Heal on roads.' },
        { type: 'upgrade', name: '+10% Def', desc: 'All units +10% defense.' },
        { type: 'unit', name: 'Artillery', desc: 'Indirect fire unit.' },
        { type: 'upgrade', name: 'Capture+', desc: 'Capture 20% faster.' },
      ]},
      // Rows 2-3: Fortress block (fortress at columns 3-4, index 2-3)
      { type: 'fortress-block', 
        fortress: { id: 'f1', name: 'Steel Bastion', desc: 'Fortified stronghold.', reward: '+25% Armor & Heavy Tank', colStart: 2 },
        topRow: [
          { type: 'special', name: 'First Strike', desc: 'Attack first.' },
          { type: 'upgrade', name: 'Ammo+', desc: '+2 ammo capacity.' },
          // cols 2-3 are fortress
          { type: 'upgrade', name: '+15% Air', desc: '+15% vs aircraft.' },
          { type: 'unit', name: 'Anti-Air', desc: 'Destroys aircraft.' },
        ],
        bottomRow: [
          { type: 'unit', name: 'Light Tank', desc: 'Fast armor.' },
          { type: 'upgrade', name: 'Treads', desc: 'Ignore terrain cost.' },
          // cols 2-3 are fortress
          { type: 'unit', name: 'Rockets', desc: 'Long range damage.' },
          { type: 'special', name: 'Ambush', desc: 'Forest +15% damage.' },
        ]
      },
      // Row 4: Boss
      { type: 'boss', name: 'General Steelheart', desc: 'Eastern Front Commander.', reward: 'Medium Tank + Iron Will' },
      // Row 5
      { type: 'normal', cells: [
        { type: 'unit', name: 'Med Tank', desc: 'Stronger armor.' },
        { type: 'special', name: 'Blitz', desc: 'Act again after kills.' },
        { type: 'upgrade', name: 'Armor+', desc: 'Tanks +15% defense.' },
        { type: 'unit', name: 'Fighter', desc: 'Air superiority.' },
        { type: 'unit', name: 'Bomber', desc: 'Devastates ground.' },
        { type: 'upgrade', name: '+2 Air Move', desc: 'Aircraft +2 movement.' },
      ]},
      // Rows 6-7: Fortress block (fortress at columns 3-4)
      { type: 'fortress-block',
        fortress: { id: 'f2', name: 'Sky Citadel', desc: 'Aerial fortress.', reward: 'Stealth Jet + Air Supremacy', colStart: 2 },
        topRow: [
          { type: 'upgrade', name: 'Fuel+', desc: '+50% fuel capacity.' },
          { type: 'special', name: 'Entrench', desc: 'Stationary +20% def.' },
          // cols 2-3 are fortress
          { type: 'unit', name: 'Missiles', desc: 'Indirect anti-air.' },
          { type: 'unit', name: 'Cruiser', desc: 'Naval anti-air.' },
        ],
        bottomRow: [
          { type: 'special', name: 'Air Drop', desc: 'Deploy infantry anywhere.' },
          { type: 'unit', name: 'Hvy Tank', desc: 'Massive armor.' },
          // cols 2-3 are fortress
          { type: 'upgrade', name: '+10% All', desc: 'All units +10% attack.' },
          { type: 'special', name: 'Airstrike', desc: 'Call bombing run.' },
        ]
      },
      // Row 8: Boss
      { type: 'boss', name: 'Admiral Darkwave', desc: 'Naval warfare master.', reward: 'Battleship + Tidal Surge' },
      // Row 9
      { type: 'normal', cells: [
        { type: 'unit', name: 'Submarine', desc: 'Stealth ship.' },
        { type: 'special', name: 'Sonar', desc: 'Detect subs.' },
        { type: 'upgrade', name: '+20% Naval', desc: 'Ships +20% damage.' },
        { type: 'unit', name: 'Carrier', desc: 'Mobile airbase.' },
        { type: 'upgrade', name: '+2 Range', desc: 'Ships +2 fire range.' },
        { type: 'special', name: 'Fortress', desc: 'HQ +50% defense.' },
      ]},
      // Rows 10-11: Fortress block
      { type: 'fortress-block',
        fortress: { id: 'f3', name: 'Omega Base', desc: 'Final stronghold.', reward: 'Mega Tank + Laser Artillery', colStart: 2 },
        topRow: [
          { type: 'special', name: 'EMP', desc: 'Disable enemies.' },
          { type: 'upgrade', name: 'Elite', desc: 'Units start veteran.' },
          // cols 2-3 are fortress
          { type: 'unit', name: 'Laser Tank', desc: 'Ignores defense.' },
          { type: 'special', name: '???', desc: 'Unknown power.' },
        ],
        bottomRow: [
          { type: 'upgrade', name: 'Economy+', desc: '+10% income.' },
          { type: 'special', name: 'Veterancy', desc: 'Kills grant +5%.' },
          // cols 2-3 are fortress
          { type: 'upgrade', name: '+15% All', desc: 'All units +15% attack.' },
          { type: 'unit', name: 'Stealth', desc: 'Invisible jet.' },
        ]
      },
      // Row 12: Final Boss
      { type: 'boss', name: '??? Supreme Commander ???', desc: 'The final battle...', reward: '???' },
    ];

    // Track completed cells: "row-col" for normal, "boss-rowIndex", "fortress-id"
    const completed = new Set();
    completed.add('0-2'); // Starting cells
    completed.add('0-3');

    const grid = document.getElementById('grid');
    const tooltip = document.getElementById('tooltip');

    // Convert gridRows index to actual display row (accounting for fortress blocks taking 2 rows)
    function getActualRow(gridIndex) {
      let actualRow = 0;
      for (let i = 0; i < gridIndex; i++) {
        if (gridRows[i].type === 'fortress-block') actualRow += 2;
        else actualRow += 1;
      }
      return actualRow;
    }

    // Check if position is completed
    function isCompleted(rowIndex, col) {
      return completed.has(`${rowIndex}-${col}`);
    }

    // Check adjacency for a normal cell
    function isAdjacent(rowIndex, col) {
      // Check same row
      if (col > 0 && isCompleted(rowIndex, col - 1)) return true;
      if (col < 5 && isCompleted(rowIndex, col + 1)) return true;
      
      // Check row below
      const prevRowIndex = findPrevRowIndex(rowIndex, col);
      if (prevRowIndex !== null && isCompleted(prevRowIndex, col)) return true;
      
      // Check row above
      const nextRowIndex = findNextRowIndex(rowIndex, col);
      if (nextRowIndex !== null && isCompleted(nextRowIndex, col)) return true;
      
      return false;
    }

    function findPrevRowIndex(currentIndex, col) {
      // Find the row below current that has a cell at this column
      for (let i = currentIndex - 1; i >= 0; i--) {
        const row = gridRows[i];
        if (row.type === 'boss') continue; // skip bosses for adjacency
        if (row.type === 'normal') return i;
        if (row.type === 'fortress-block') {
          // Check if col is part of fortress (cols 2-3)
          if (col === 2 || col === 3) {
            // Adjacent to fortress from above
            return i;
          }
          return i;
        }
      }
      return null;
    }

    function findNextRowIndex(currentIndex, col) {
      for (let i = currentIndex + 1; i < gridRows.length; i++) {
        const row = gridRows[i];
        if (row.type === 'boss') continue;
        if (row.type === 'normal') return i;
        if (row.type === 'fortress-block') return i;
      }
      return null;
    }

    // Check if boss is available (any cell in row below is completed)
    function isBossAvailable(bossIndex) {
      for (let i = bossIndex - 1; i >= 0; i--) {
        const row = gridRows[i];
        if (row.type === 'normal') {
          for (let c = 0; c < 6; c++) {
            if (isCompleted(i, c)) return true;
          }
          return false;
        }
        if (row.type === 'fortress-block') {
          // Check bottom row of fortress block and fortress itself
          for (let c = 0; c < 6; c++) {
            if (isCompleted(i, c)) return true;
          }
          if (completed.has(`fortress-${row.fortress.id}`)) return true;
          return false;
        }
      }
      return false;
    }

    // Fortress adjacency
    function getFortressAdjacency(fortressBlockIndex) {
      const block = gridRows[fortressBlockIndex];
      const fid = block.fortress.id;
      
      // Perimeter: cols 0,1,4,5 in both rows + cols 2,3 above and below
      let adjacentCompleted = 0;
      let totalAdjacent = 0;
      
      // Left and right columns in fortress rows
      [0, 1, 4, 5].forEach(c => {
        // Top row of fortress block
        totalAdjacent++;
        if (isCompleted(fortressBlockIndex, c)) adjacentCompleted++;
      });
      
      // Bottom row adjacent cells (from row below fortress block)
      const belowIndex = fortressBlockIndex - 1;
      if (belowIndex >= 0) {
        [2, 3].forEach(c => {
          totalAdjacent++;
          if (isCompleted(belowIndex, c)) adjacentCompleted++;
        });
      }
      
      // Top row adjacent cells (from row above fortress block)
      const aboveIndex = fortressBlockIndex + 1;
      if (aboveIndex < gridRows.length && gridRows[aboveIndex].type !== 'boss') {
        [2, 3].forEach(c => {
          totalAdjacent++;
          if (isCompleted(aboveIndex, c)) adjacentCompleted++;
        });
      }
      
      const needed = Math.ceil(totalAdjacent * 0.5);
      return { completedCount: adjacentCompleted, needed, total: totalAdjacent };
    }

    function renderGrid() {
      grid.innerHTML = '';
      let counts = { unit: 0, upgrade: 0, special: 0, boss: 0, fortress: 0 };

      // Render from top to bottom (reverse order)
      for (let i = gridRows.length - 1; i >= 0; i--) {
        const rowData = gridRows[i];

        if (rowData.type === 'boss') {
          renderBossRow(i, rowData, counts);
        } else if (rowData.type === 'normal') {
          renderNormalRow(i, rowData, counts);
        } else if (rowData.type === 'fortress-block') {
          renderFortressBlock(i, rowData, counts);
        }
      }

      document.getElementById('unit-count').textContent = counts.unit;
      document.getElementById('upgrade-count').textContent = counts.upgrade;
      document.getElementById('special-count').textContent = counts.special;
      document.getElementById('boss-count').textContent = counts.boss;
      document.getElementById('fortress-count').textContent = counts.fortress;
    }

    function renderBossRow(index, data, counts) {
      const rowEl = document.createElement('div');
      rowEl.className = 'row boss-row';

      const isComplete = completed.has(`boss-${index}`);
      const isAvail = !isComplete && isBossAvailable(index);

      if (isComplete) counts.boss++;

      const bossEl = document.createElement('div');
      bossEl.className = `boss-cell ${isComplete ? 'completed' : isAvail ? 'available' : 'locked'}`;
      bossEl.dataset.type = 'boss';
      bossEl.dataset.name = data.name;
      bossEl.dataset.desc = data.desc;
      bossEl.dataset.index = index;

      bossEl.innerHTML = `
        <div class="boss-tag">Boss Battle</div>
        <span class="boss-icon">👑</span>
        <div class="boss-info">
          <span class="boss-name">${data.name}</span>
          <span class="boss-reward">🎁 ${data.reward}</span>
        </div>
      `;

      bossEl.addEventListener('mouseenter', showTooltip);
      bossEl.addEventListener('mousemove', moveTooltip);
      bossEl.addEventListener('mouseleave', hideTooltip);
      bossEl.addEventListener('click', () => {
        if (!bossEl.classList.contains('available')) return;
        bossEl.classList.add('completing');
        setTimeout(() => {
          completed.add(`boss-${index}`);
          renderGrid();
        }, 150);
      });

      rowEl.appendChild(bossEl);
      grid.appendChild(rowEl);
    }

    function renderNormalRow(index, data, counts) {
      const rowEl = document.createElement('div');
      rowEl.className = 'row';

      data.cells.forEach((cellData, col) => {
        const cell = createCell(index, col, cellData, counts);
        rowEl.appendChild(cell);
      });

      grid.appendChild(rowEl);
    }

    function renderFortressBlock(index, data, counts) {
      const fid = data.fortress.id;
      const isComplete = completed.has(`fortress-${fid}`);
      const adj = getFortressAdjacency(index);
      const isAvail = !isComplete && adj.completedCount >= adj.needed;

      if (isComplete) counts.fortress++;

      // Create container for the 2 rows
      const blockEl = document.createElement('div');
      blockEl.className = 'row tall-row';
      blockEl.style.display = 'grid';
      blockEl.style.gridTemplateColumns = `repeat(6, var(--cell-size))`;
      blockEl.style.gridTemplateRows = `repeat(2, var(--cell-size))`;
      blockEl.style.gap = 'var(--gap)';
      blockEl.style.height = 'auto';

      // Top row cells (cols 0, 1, then fortress, then 4, 5)
      data.topRow.forEach((cellData, idx) => {
        const col = idx < 2 ? idx : idx + 2; // 0,1 -> 0,1; 2,3 -> 4,5
        const cell = createCell(index, col, cellData, counts);
        cell.style.gridColumn = col + 1;
        cell.style.gridRow = 1;
        blockEl.appendChild(cell);
      });

      // Bottom row cells
      data.bottomRow.forEach((cellData, idx) => {
        const col = idx < 2 ? idx : idx + 2;
        const cell = createCell(index, col, cellData, counts);
        cell.style.gridColumn = col + 1;
        cell.style.gridRow = 2;
        blockEl.appendChild(cell);
      });

      // Fortress (spans cols 3-4, rows 1-2)
      const fortressEl = document.createElement('div');
      fortressEl.className = `fortress-cell ${isComplete ? 'completed' : isAvail ? 'available' : 'locked'}`;
      fortressEl.style.gridColumn = '3 / span 2';
      fortressEl.style.gridRow = '1 / span 2';
      fortressEl.dataset.type = 'fortress';
      fortressEl.dataset.name = data.fortress.name;
      fortressEl.dataset.desc = data.fortress.desc;
      fortressEl.dataset.fid = fid;

      fortressEl.innerHTML = `
        <div class="fortress-tag">Fortress</div>
        <span class="fortress-icon">🏰</span>
        <span class="fortress-name">${data.fortress.name}</span>
        <span class="fortress-reward">🎁 ${data.fortress.reward}</span>
        <span class="fortress-req">${isComplete ? '✓ Conquered' : `Surround: <span class="${adj.completedCount >= adj.needed ? 'filled' : ''}">${adj.completedCount}</span>/${adj.needed}`}</span>
      `;

      fortressEl.addEventListener('mouseenter', showTooltip);
      fortressEl.addEventListener('mousemove', moveTooltip);
      fortressEl.addEventListener('mouseleave', hideTooltip);
      fortressEl.addEventListener('click', () => {
        if (!fortressEl.classList.contains('available')) return;
        fortressEl.classList.add('completing');
        setTimeout(() => {
          completed.add(`fortress-${fid}`);
          // Mark fortress cells as completed for adjacency
          completed.add(`${index}-2`);
          completed.add(`${index}-3`);
          renderGrid();
        }, 150);
      });

      blockEl.appendChild(fortressEl);
      grid.appendChild(blockEl);
    }

    function createCell(rowIndex, col, cellData, counts) {
      const key = `${rowIndex}-${col}`;
      const isComplete = completed.has(key);
      const isAvail = !isComplete && isAdjacent(rowIndex, col);
      const isStart = rowIndex === 0 && (col === 2 || col === 3);

      if (isComplete) counts[cellData.type]++;

      const cell = document.createElement('div');
      cell.className = `cell ${cellData.type}`;
      cell.dataset.row = rowIndex;
      cell.dataset.col = col;
      cell.dataset.name = cellData.name;
      cell.dataset.desc = cellData.desc;
      cell.dataset.type = cellData.type;

      if (isComplete) cell.classList.add('completed');
      else if (isAvail) cell.classList.add('available');
      else cell.classList.add('locked');

      if (isStart) cell.classList.add('start');

      cell.innerHTML = `
        <span class="cell-icon">${icons[cellData.type]}</span>
        <span class="cell-label">${cellData.name}</span>
      `;

      cell.addEventListener('mouseenter', showTooltip);
      cell.addEventListener('mousemove', moveTooltip);
      cell.addEventListener('mouseleave', hideTooltip);
      cell.addEventListener('click', () => {
        if (!cell.classList.contains('available')) return;
        cell.classList.add('completing');
        setTimeout(() => {
          completed.add(key);
          renderGrid();
        }, 150);
      });

      return cell;
    }

    function showTooltip(e) {
      const el = e.currentTarget;
      tooltip.querySelector('.tooltip-title').textContent = el.dataset.name;
      tooltip.querySelector('.tooltip-title').className = `tooltip-title ${el.dataset.type}`;
      tooltip.querySelector('.tooltip-desc').textContent = el.dataset.desc;
      
      const statusEl = tooltip.querySelector('.tooltip-status');
      if (el.classList.contains('completed')) {
        statusEl.textContent = '✓ Completed';
        statusEl.className = 'tooltip-status available';
      } else if (el.classList.contains('available')) {
        statusEl.textContent = '● Click to battle';
        statusEl.className = 'tooltip-status available';
      } else {
        statusEl.textContent = el.dataset.type === 'fortress' ? '○ Surround to unlock' : 
                               el.dataset.type === 'boss' ? '○ Clear row below' : '○ Unlock adjacent first';
        statusEl.className = 'tooltip-status locked';
      }

      tooltip.classList.add('visible');
      moveTooltip(e);
    }

    function moveTooltip(e) {
      tooltip.style.left = e.pageX + 15 + 'px';
      tooltip.style.top = e.pageY + 15 + 'px';
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    renderGrid();
  </script>
</body>
</html>
