<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex Dominion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    #gameCanvas { display: block; cursor: grab; }
    #gameCanvas:active { cursor: grabbing; }

    #hud {
      position: fixed; top: 20px; left: 20px; color: #e0e0e0; font-size: 14px;
      background: rgba(0, 0, 0, 0.6); padding: 12px 16px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
    }
    #hud h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #ffd700; letter-spacing: 1px; }
    #hud p { opacity: 0.8; line-height: 1.5; }
    .hud-reroll-btn {
      margin-top: 10px;
      padding: 8px 14px;
      border: 1px solid #6495ED50;
      border-radius: 6px;
      background: #6495ED30;
      color: #6495ED;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .hud-reroll-btn:hover {
      background: #6495ED50;
      border-color: #6495ED;
    }
    kbd { background: rgba(255, 255, 255, 0.15); padding: 2px 6px; border-radius: 4px; font-family: inherit; font-size: 12px; }

    #coords {
      position: fixed; bottom: 20px; left: 20px; color: #e0e0e0; font-size: 14px;
      background: rgba(0, 0, 0, 0.6); padding: 12px 16px; border-radius: 8px; font-family: 'Courier New', monospace;
      border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); line-height: 1.6;
      display: none; /* Hidden until game starts */
    }
    #hud {
      display: none; /* Hidden until game starts */
    }
    .game-active #hud, .game-active #coords {
      display: block;
    }

    /* Main Menu Overlay */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .menu-overlay.hidden {
      display: none;
    }
    .menu-title {
      font-size: 64px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .menu-subtitle {
      font-size: 24px;
      color: #888888;
      margin-bottom: 50px;
    }
    .menu-players {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
    }
    .menu-player-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .menu-player-label {
      font-size: 16px;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .menu-player-label.player { color: #6495ED; }
    .menu-player-label.enemy { color: #ff6b6b; }
    .menu-select {
      background: #ffffff15;
      border: 2px solid #ffffff30;
      border-radius: 6px;
      padding: 10px 16px;
      color: #ffffff;
      font-size: 16px;
      min-width: 160px;
      cursor: pointer;
      outline: none;
    }
    .menu-select:hover {
      border-color: #ffffff50;
    }
    .menu-select:focus {
      border-color: #6495ED;
    }
    .menu-select option {
      background: #1a1a2e;
      color: #ffffff;
    }
    .menu-map-label {
      font-size: 18px;
      color: #aaaaaa;
      margin-bottom: 16px;
    }
    .menu-buttons {
      display: flex;
      gap: 20px;
    }
    .menu-btn {
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .menu-btn:hover {
      transform: scale(1.05);
    }
    .menu-btn:active {
      transform: scale(0.98);
    }
    .menu-btn-small {
      background: #e65100;
      color: #ffffff;
    }
    .menu-btn-small:hover {
      background: #ff9800;
    }
    .menu-btn-small .btn-desc {
      font-size: 12px;
      font-weight: normal;
      color: #ffcc80;
      display: block;
      margin-top: 4px;
    }
    .menu-btn-normal {
      background: #2e7d32;
      color: #ffffff;
    }
    .menu-btn-normal:hover {
      background: #4caf50;
    }
    .menu-btn-normal .btn-desc {
      font-size: 12px;
      font-weight: normal;
      color: #a5d6a7;
      display: block;
      margin-top: 4px;
    }
    .menu-hint {
      margin-top: 40px;
      font-size: 14px;
      color: #666666;
    }
    .menu-seed-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }
    .menu-seed-label {
      font-size: 16px;
      color: #888888;
    }
    #seed-display {
      font-family: 'Courier New', monospace;
      color: #6495ED;
    }
    .menu-btn-reroll {
      padding: 8px 16px;
      border: 2px solid #6495ED50;
      border-radius: 6px;
      background: #6495ED20;
      color: #6495ED;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .menu-btn-reroll:hover {
      background: #6495ED40;
      border-color: #6495ED;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Main Menu Overlay -->
  <div id="main-menu" class="menu-overlay">
    <h1 class="menu-title">HEX DOMINION</h1>
    <p class="menu-subtitle">A Turn-Based Strategy Game</p>

    <div class="menu-players">
      <div class="menu-player-col">
        <label class="menu-player-label player">Player</label>
        <select id="player-select" class="menu-select"></select>
      </div>
      <div class="menu-player-col">
        <label class="menu-player-label enemy">Enemy</label>
        <select id="enemy-select" class="menu-select"></select>
      </div>
    </div>

    <p class="menu-map-label">Select Map Size</p>
    <div class="menu-buttons">
      <button id="btn-small-map" class="menu-btn menu-btn-small">
        Small
        <span class="btn-desc">Test map - all grass</span>
      </button>
      <button id="btn-normal-map" class="menu-btn menu-btn-normal">
        Normal
        <span class="btn-desc">Full procedural map</span>
      </button>
    </div>

    <div class="menu-seed-row">
      <span class="menu-seed-label">Seed: <span id="seed-display">12345</span></span>
      <button id="btn-reroll-seed" class="menu-btn-reroll">Re-roll</button>
    </div>

    <p class="menu-hint">Press 1 for Small, 2 for Normal, or click a button</p>
  </div>

  <div id="hud">
    <h1>HEX DOMINION</h1>
    <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> pan · <kbd>drag</kbd> mouse<br><kbd>scroll</kbd> to zoom</p>
    <button id="btn-reroll-ingame" class="hud-reroll-btn">Re-roll Map</button>
  </div>

  <div id="coords">--</div>

  <script src="dist/bundle.js"></script>
</body>
</html>
